name: Crear exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ursina pyinstaller
      - run: pyinstaller --noconfirm --onedir --collect-all ursina --collect-all panda3d frente_de_batalla.py
      - uses: actions/upload-artifact@v4
        with:
          name: FrenteDeBatalla-windows
          path: dist/frente_de_batalla
